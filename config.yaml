mode: demo
llm:
  model: gpt-4o-mini
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
  timeout_seconds: 90
  max_retries: 3
  base_delay_seconds: 0.5
  max_tokens: 1024
  temperature: 0.2
  top_p: 0.7
harness:
  max_iterations: 10
  token_budget: 20000
memory:
  backend: chroma
  persist_directory: .agent_memory
  collection: interview_question_agent
logging:
  path: logs/agent.jsonl
